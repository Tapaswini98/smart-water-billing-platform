server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Trust nothing about the upstream's identity headers.
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Same-origin proxy to the API. This is why the browser never learns the API's
    # address, why there is no CORS configuration anywhere in this project, and why
    # one image works unchanged on a developer laptop and on an on-premise box.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # An admin triggering a billing run across the whole estate can legitimately
        # take longer than nginx's 60s default.
        proxy_read_timeout 120s;
    }

    # The API's own probes, proxied so an operator can reach everything on one port.
    location /health/ {
        proxy_pass       http://api:8080/health/;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached: it is what points at the hashed bundles, so a
    # stale copy pins a browser to a deleted build after every deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's, not 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
